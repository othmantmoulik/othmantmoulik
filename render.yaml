services:
  - type: web
    name: almasterclass-platform
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: COMMISSION_PERCENTAGE
        value: 30
      - key: MINIMUM_PAYOUT
        value: 50
      - key: BASE_URL
        sync: false
